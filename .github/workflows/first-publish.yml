# The FIRST publish, and only the first.
#
# npm refuses to attach a trusted publisher to a package that does not exist -
# deliberately, since anyone could otherwise reserve a name they do not own. So
# the very first version cannot go out by OIDC, and this workflow exists to get
# past that one wall with a token.
#
# It is meant to be DELETED once the package exists on the registry, together
# with the secret it reads and the token behind it. From then on `publish.yml`
# does the work, authenticated by OIDC, with nothing to rotate or leak.
#
# The token has to be a granular access token with read and write on ALL
# packages - the package not existing yet, it cannot be scoped to it - and with
# "Bypass 2FA" ticked, because a CLI publish otherwise asks for a one-time code
# that a Windows Hello security key cannot produce. GitHub restricted those
# tokens on 2026-07-31: they can no longer manage tokens, package access or
# trusted publishing, and they lose direct publish in January 2027. Publishing
# is exactly what they can still do today, and it is all this needs.
name: first-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, with the v prefix (e.g. v0.0.1).
        required: true
        default: v0.0.1

permissions:
  contents: read
  id-token: write # provenance, which works with a token as well as with OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # `registry-url` writes the .npmrc auth line that reads NODE_AUTH_TOKEN.
      # It is what BLOCKS OIDC, which is why it appears here and never in
      # `publish.yml`: npm only reaches for OIDC when it finds no credential.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: node --test test/*.test.js

      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # A publish that fails says WHY rather than arriving as a bare
          # "need auth" that reads like a missing secret.
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm publish --provenance --access public
